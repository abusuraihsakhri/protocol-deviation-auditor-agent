[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-deviation-auditor-engine"
version = "2.0.0"
description = "ICH-GCP Protocol Deviation & Good Clinical Practice Auditor Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
protocol-deviation-auditor-engine = "gcp_protocol_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/protocol-deviation-auditor-engine"
Repository = "https://github.com/abusuraihsakhri/protocol-deviation-auditor-engine.git"
