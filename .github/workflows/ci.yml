name: Test and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: python -m pip install -e ".[api,test]"
      - name: Python regression suite
        env:
          AUDIT_SECRET_KEY: ci-only-audit-secret-for-unit-tests
        run: python -m pytest -q
      - name: Verify security properties in clean process
        env:
          AUDIT_SECRET_KEY: ci-only-audit-secret-for-unit-tests
        run: |
          python - <<'PY'
          from agents.base import AuditTrail, PHIGuard, SecurityException
          trail = AuditTrail()
          trail.log("ci", "check", "CREATED", {"task_id": "SYNTHETIC-1"})
          assert trail.verify_integrity()
          trail.logs[0]["actor"] = "tampered"
          assert not trail.verify_integrity()
          try:
              PHIGuard.assert_no_phi("MRN-123456")
          except SecurityException:
              pass
          else:
              raise AssertionError("PHI pattern screening failed")
          PY
      - name: Run browser rule regression tests
        run: |
          node --check web/audit.mjs
          node --test tests/web.test.mjs
